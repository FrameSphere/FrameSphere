<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Standard-Meta (Defaults). Pro-Route-SEO wird von react-helmet-async
         gesetzt (siehe src/components/Seo.jsx + src/seo/seoConfig.js). -->
    <title>FrameSphere – AI Tools & APIs für Entwickler</title>
    <meta name="author" content="FrameSphere" />
    <meta name="robots" content="index, follow" />

    <!-- Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "FrameSphere",
      "url": "https://frame-sphere.vercel.app/",
      "description": "FrameSphere entwickelt leistungsstarke AI-Tools und APIs für Entwickler.",
      "location": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mainz",
          "addressCountry": "DE"
        }
      },
      "offers": [
        { "@type": "Offer", "name": "FrameSpell API", "url": "https://framespell.pages.dev/" },
        { "@type": "Offer", "name": "RateLimit API", "url": "https://ratelimit-api.pages.dev/" },
        { "@type": "Offer", "name": "FrameTrain", "url": "https://frame-train.com/" }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
